// Auth check

if (!user) window.location.href = 'login.html';
else document.getElementById('userName').textContent = user.name || user.email;

const subject = params.get('subject') || 'math';

document.getElementById('pageTitle').textContent = `${GRADES_LABEL[grade]} — ${SUBJECT_LABEL[subject]}`;

function logout() {
  localStorage.removeItem('gotab_user');

// ── Card builders ──

function makePptCard(title, meta) {
  return `<div class="content-card">
    <div class="card-preview ppt-preview">
      <span class="card-preview-icon">📊</span>
    </div>
    <div class="card-body">
      <div class="card-title">${title}</div>
      <div class="card-meta">${meta}</div>
    </div>
    <div class="card-footer">
      <button class="btn-download" onclick="openModal()">Жүктеу</button>
    </div>
  </div>`;
}

function makeQmjCard(title, meta) {
  return `<div class="content-card">
    <div class="card-preview qmj-preview">
      <span class="card-preview-icon">📄</span>
    </div>
    <div class="card-body">
      <div class="card-title">${title}</div>
      <div class="card-meta">${meta}</div>
    </div>
    <div class="card-footer">
      <button class="btn-download" onclick="openModal()">Жүктеу</button>
    </div>
  </div>`;
}

function makeVideoCard(title, meta, videoSrc) {
  if (videoSrc) {
    return `<div class="content-card">
      <div class="card-preview video-preview" onclick="toggleVideo(this)">
        <video src="${videoSrc}" loop preload="metadata"></video>
        <div class="play-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${title}</div>
        <div class="card-meta">${meta}</div>
      </div>
      <div class="card-footer">
        <button class="btn-download" onclick="openModal()">Жүктеу</button>
      </div>
    </div>`;
  }
  return `<div class="content-card">
    <div class="card-preview video-preview">
      <span class="card-preview-icon">🎬</span>
    </div>
    <div class="card-body">
      <div class="card-title">${title}</div>
      <div class="card-meta">${meta}</div>
    </div>
    <div class="card-footer">
      <button class="btn-download" onclick="openModal()">Жүктеу</button>
    </div>
  </div>`;
}

function makeEmptyCard(label) {
  return `<div class="card-empty">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
    <span>${label}</span>
  </div>`;
}

// ── Render content ──
function render() {
  const data = (CONTENT[grade] || CONTENT[5])[subject] || Object.values(CONTENT[grade] || CONTENT[5])[0];

  // PPT cards
  const pptGrid = document.getElementById('pptGrid');
  if (data.ppt && data.ppt.length) {
    pptGrid.innerHTML = data.ppt.map(c => makePptCard(c.title, c.meta)).join('') +
      makeEmptyCard('Презентация қосу');
  } else {
    pptGrid.innerHTML = [1,2,3].map(() => makeEmptyCard('Презентация қосылмаған')).join('');
  }

  // ҚМЖ cards
  const qmjGrid = document.getElementById('qmjGrid');
  if (data.qmj && data.qmj.length) {
    qmjGrid.innerHTML = data.qmj.map(c => makeQmjCard(c.title, c.meta)).join('') +
      makeEmptyCard('ҚМЖ қосу');
  } else {
    qmjGrid.innerHTML = [1,2].map(() => makeEmptyCard('ҚМЖ қосылмаған')).join('');
  }

  // Video cards
  const videoGrid = document.getElementById('videoGrid');
  if (data.videos && data.videos.length) {
    videoGrid.innerHTML = data.videos.map(c => makeVideoCard(c.title, c.meta, c.src)).join('') +
      makeEmptyCard('Видео қосу');
  } else {
    videoGrid.innerHTML = [1,2].map(() => makeEmptyCard('Видео қосылмаған')).join('');
  }
}

render();

// ── Video toggle ──
function toggleVideo(previewEl) {
  const video = previewEl.querySelector('video');
  const playBtn = previewEl.querySelector('.play-btn');
  if (!video) return;
  if (video.paused) {
    video.play();
    if (playBtn) playBtn.style.display = 'none';
  } else {
    video.pause();
    if (playBtn) playBtn.style.display = 'flex';
  }
}

// ── Payment modal ──
function openModal() {
  document.getElementById('payModal').classList.add('open');
}

function closeModal() {
  document.getElementById('payModal').classList.remove('open');
}

document.getElementById('payModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function sendReceipt() {
  const phone = '77055894347';
  const msg = encodeURIComponent('Сәлем! GoTAB платформасына жазылым үшін төлем жасадым. Чекті жіберемін.');
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}
