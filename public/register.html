<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Тіркелу</title>
<link rel="stylesheet" href="gotab.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html"><img src="gotab_logo.png" alt="GoTAB"></a>
    </div>
    <h1 class="auth-title">Тіркелу</h1>
    <p class="auth-sub">Мұғалімдер платформасына тіркеліңіз</p>

    <div class="error-msg" id="errMsg"></div>

    <form id="regForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Аты-жөні</label>
        <input type="text" id="nameInput" placeholder="Мысалы: Айгүл Ахметова" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="example@mail.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label>Телефон нөмірі</label>
        <input type="tel" id="phoneInput" placeholder="+7 705 123 4567">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="passInput" placeholder="Кемінде 6 таңба" autocomplete="new-password" required minlength="6">
      </div>
      <div class="form-group">
        <label>Парольді растаңыз</label>
        <input type="password" id="pass2Input" placeholder="Парольді қайталаңыз" required>
      </div>
      <button type="submit" class="btn-primary" id="regBtn">Тіркелу</button>
    </form>

    <div class="auth-switch">
      Аккаунт бар ма? <a href="login.html">Кіру</a>
    </div>
  </div>
</div>

<script>
async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  const errMsg = document.getElementById('errMsg');
  const name = document.getElementById('nameInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const password = document.getElementById('passInput').value;
  const pass2 = document.getElementById('pass2Input').value;

  errMsg.style.display = 'none';

  if (password !== pass2) {
    errMsg.textContent = 'Парольдер сәйкес келмейді';
    errMsg.style.display = 'block';
    return;
  }

  btn.textContent = 'Тіркелу...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone, password })
    });
    const data = await res.json();

    if (data.ok) {
      localStorage.setItem('gotab_user', JSON.stringify(data.user));
      window.location.href = 'dashboard.html';
    } else {
      errMsg.textContent = data.error || 'Тіркелу мүмкін болмады';
      errMsg.style.display = 'block';
      btn.textContent = 'Тіркелу';
      btn.disabled = false;
    }
  } catch {
    errMsg.textContent = 'Қосылу қатесі. Қайталап көріңіз.';
    errMsg.style.display = 'block';
    btn.textContent = 'Тіркелу';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
