<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Мұғалімдерге арналған платформа</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background:#f0f4fb;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}

/* Soft blue orbs */
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(26,86,219,.10),transparent 70%);top:-100px;left:-100px}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(8,145,178,.08),transparent 70%);bottom:-80px;right:-80px}
.orb3{width:300px;height:300px;background:radial-gradient(circle,rgba(99,102,241,.07),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%)}

.container{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  padding:20px;
  display:flex;flex-direction:column;align-items:center;
}

/* Badge */
.top-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 16px;
  background:rgba(26,86,219,.08);
  border:1px solid rgba(26,86,219,.18);
  border-radius:100px;
  font-size:11px;font-weight:700;letter-spacing:1.5px;
  color:#1a56db;text-transform:uppercase;
  margin-bottom:28px;
}
.top-badge span{width:6px;height:6px;border-radius:50%;background:#1a56db;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Logo */
.logo-wrap{margin-bottom:32px}
.logo-wrap img{height:72px;display:block}

/* Card */
.card{
  width:100%;
  background:#ffffff;
  border:1px solid #dde5f4;
  border-radius:24px;
  padding:36px 32px 32px;
  box-shadow:0 8px 32px rgba(26,86,219,.10), inset 0 1px 0 rgba(255,255,255,.8);
}

.card-title{font-size:22px;font-weight:800;color:#0f172a;text-align:center;margin-bottom:6px;letter-spacing:-.3px}
.card-sub{font-size:13px;color:#64748b;text-align:center;margin-bottom:28px;line-height:1.5}

.btns{display:flex;flex-direction:column;gap:12px}

.btn-login{
  display:block;padding:15px;
  background:transparent;
  border:2px solid rgba(26,86,219,.3);
  border-radius:14px;color:#1a56db;
  font-size:16px;font-weight:700;
  font-family:'Inter',sans-serif;
  text-align:center;text-decoration:none;transition:all .2s;
}
.btn-login:hover{background:rgba(26,86,219,.06);border-color:#1a56db}

.btn-register{
  display:block;padding:15px;
  background:linear-gradient(135deg,#1a56db,#0891b2);
  border:none;border-radius:14px;color:#fff;
  font-size:16px;font-weight:700;
  font-family:'Inter',sans-serif;
  text-align:center;text-decoration:none;transition:all .2s;
  box-shadow:0 8px 24px rgba(26,86,219,.25);
}
.btn-register:hover{opacity:.92;transform:translateY(-1px)}

.divider{display:flex;align-items:center;gap:12px;margin:4px 0;color:#dde5f4;font-size:12px;color:#94a3b8}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#dde5f4}

.features{display:flex;justify-content:center;gap:20px;margin-top:24px;flex-wrap:wrap}
.feat{display:flex;align-items:center;gap:6px;font-size:11px;color:#94a3b8;font-weight:600}
.feat svg{color:#1a56db}
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<div class="container">
  <div class="top-badge">
    <span></span>
    Мұғалімдерге арналған платформа
  </div>

  <div class="logo-wrap">
    <img src="gotab_logo.png" alt="GoTAB">
  </div>

  <div class="card">
    <div class="card-title">Қош келдіңіз!</div>
    <div class="card-sub">Презентация · ҚМЖ · Математика анимациялары</div>
    <div class="btns">
      <a href="register.html" class="btn-register">Тіркелу</a>
      <div class="divider">немесе</div>
      <a href="login.html" class="btn-login">Кіру</a>
    </div>
  </div>

  <div class="features">
    <div class="feat">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      5–11 сынып
    </div>
    <div class="feat">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Тегін тіркелу
    </div>
    <div class="feat">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      HD Анимациялар
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>redirectIfLoggedIn();</script>
<script src="math-bg.js"></script>
</body>
</html>
